# GoReleaser config for PokéArena release artifacts.
# https://goreleaser.com — schema: `goreleaser schema`.
#
# Triggered by .github/workflows/release.yml on a `v*` tag. It cross-compiles
# the three user-facing commands, tars/zips them per platform, and writes a
# sha256 checksum file. Everything here works with the default GITHUB_TOKEN —
# no signing, no notarization, no external secrets.
#
# Build flags mirror the Dockerfile (`CGO_ENABLED=0 go build -trimpath
# -ldflags="-s -w"`) so a released binary is byte-comparable with a locally
# built one. No `-X main.version=...` injection: no command in this tree
# declares a version variable, so there is nothing to stamp.
version: 2

project_name: pokearena

before:
  hooks:
    - go mod download

builds:
  # The MCP server Claude Code (or any MCP client) spawns as a subprocess.
  # See docs/mcp-protocol.md — it runs on the user's machine and dials the
  # arena gateway over WebSocket.
  - id: pokearena-mcp
    main: ./cmd/pokearena-mcp
    binary: pokearena-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Reference LLM harness: headless CLI that plays a slot end to end.
  - id: pokearena-agent
    main: ./cmd/pokearena-agent
    binary: pokearena-agent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The benchmark (./cmd/bench). Renamed on the way out so the artifact is
  # self-describing once it lands in someone's ~/Downloads; the package path
  # and all docs still say `./cmd/bench`.
  - id: pokearena-bench
    main: ./cmd/bench
    binary: pokearena-bench
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

# A single fat Mach-O for the MCPB bundle. An .mcpb declares one command per
# OS (manifest_version 0.3 has no per-architecture selector), so the macOS
# entry has to run on both Apple Silicon and Intel. `replace: false` keeps the
# per-arch binaries for the normal archives.
universal_binaries:
  - id: pokearena-mcp-universal
    ids:
      - pokearena-mcp
    name_template: pokearena-mcp
    replace: false

archives:
  - id: pokearena
    ids:
      - pokearena-mcp
      - pokearena-agent
      - pokearena-bench
    name_template: "pokearena_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/mcp-protocol.md
      - docs/running-the-benchmark.md
      - docs/benchmark.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: shaumik
    name: PokeArena
  draft: false
  prerelease: auto
  mode: append
  name_template: "v{{ .Version }}"
  header: |
    ## PokéArena {{ .Tag }}

    Three binaries per platform, in one archive:

    | Binary | What it is |
    |---|---|
    | `pokearena-mcp` | stdio MCP server — hands a live battle slot to Claude Code or any MCP client ([protocol](https://github.com/shaumik/PokeArena/blob/main/docs/mcp-protocol.md)) |
    | `pokearena-agent` | reference LLM harness — one-shot headless CLI that plays a slot to completion |
    | `pokearena-bench` | the reproducible battle benchmark (`./cmd/bench`) |
  footer: |
    ---

    **MCP clients:** this release also ships `pokearena-mcp-{{ .Version }}.mcpb`,
    the bundle referenced by the [MCP Registry](https://registry.modelcontextprotocol.io)
    entry `io.github.shaumik/pokearena`. Verify it against `checksums.txt` before installing.

    Binaries are unsigned. On macOS, clear the quarantine attribute with
    `xattr -d com.apple.quarantine ./pokearena-mcp` if Gatekeeper blocks the first run.
