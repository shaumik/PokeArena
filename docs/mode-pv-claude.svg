<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowinline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <style>
      .title    { fill:#e6edf3; font-weight:700; font-size:22px; }
      .subtitle { fill:#94a3b8; font-size:12px; }
      .lane     { fill:#1e3a5f; stroke:#3b82f6; stroke-width:2; }
      .laneagent{ fill:#2b1e4f; stroke:#a78bfa; stroke-width:2; }
      .lanehot  { fill:#3b2f0f; stroke:#f59e0b; stroke-width:2; }
      .lanetxt  { fill:#f1f5f9; font-weight:700; font-size:13px; }
      .lifeline { stroke:#3a4759; stroke-width:1.4; stroke-dasharray:4 4; }
      .lifestdio{ stroke:#5b4a8a; stroke-width:1.4; stroke-dasharray:4 4; }
      .arrow    { stroke:#475569; stroke-width:1.6; fill:none; }
      .arrowhot { stroke:#f59e0b; stroke-width:2;  fill:none; }
      .arrowstdio { stroke:#a78bfa; stroke-width:1.8; fill:none; }
      .arrowtxt { fill:#cbd5e1; font-size:11px; font-weight:600; }
      .arrowhottxt{ fill:#fbbf24; font-size:11.5px; font-weight:700; }
      .arrowstdiotxt{ fill:#c4b5fd; font-size:11px; font-weight:600; }
      .note     { fill:#94a3b8; font-size:10.5px; font-style:italic; }
      .loop     { stroke:#fbbf24; stroke-width:1.2; stroke-dasharray:4 3; fill:none; opacity:.55; }
      .looptxt  { fill:#fbbf24; font-size:10px; font-weight:700; letter-spacing:.5px; }
      .group    { fill:none; stroke:#a78bfa; stroke-width:1.4; stroke-dasharray:6 4; opacity:.55; }
      .grouptxt { fill:#a78bfa; font-size:10.5px; font-weight:700; letter-spacing:.6px; }
      .netlabel { fill:#64748b; font-size:10px; font-weight:700; letter-spacing:.8px; }
      .packet   { fill:#10b981; }
      .packetstdio { fill:#a78bfa; }
      .packethot{ fill:#f59e0b; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#0d1117"/>
  <text x="600" y="36" text-anchor="middle" class="title">Pv-Claude &#8212; you vs an external agent over MCP</text>
  <text x="600" y="56" text-anchor="middle" class="subtitle">browser claims slot 1 &#183; pokearena-mcp (on the user&#8217;s machine) claims slot 2 for Claude Code &#183; gateway treats both as ordinary WS clients</text>

  <!-- ===================== "user's machine" group around MCP + Claude ===================== -->
  <rect x="690" y="70" width="490" height="600" rx="10" class="group"/>
  <text x="710" y="89" class="grouptxt">USER&#8217;S MACHINE</text>

  <!-- "wss / stdio" boundary labels -->
  <text x="555" y="89" text-anchor="middle" class="netlabel">&#8592; WSS over the network</text>
  <text x="910" y="89" text-anchor="middle" class="netlabel">stdio (newline-delimited JSON-RPC)</text>

  <!-- ===================== lane heads ===================== -->
  <g>
    <rect x="55"   y="98" width="160" height="36" rx="7" class="lane"/>
    <text x="135"  y="121" text-anchor="middle" class="lanetxt">Human (browser)</text>
    <rect x="340"  y="98" width="160" height="36" rx="7" class="lanehot"/>
    <text x="420"  y="121" text-anchor="middle" class="lanetxt">gateway</text>
    <rect x="740"  y="98" width="160" height="36" rx="7" class="laneagent"/>
    <text x="820"  y="121" text-anchor="middle" class="lanetxt">pokearena-mcp</text>
    <rect x="960"  y="98" width="160" height="36" rx="7" class="laneagent"/>
    <text x="1040" y="121" text-anchor="middle" class="lanetxt">Claude Code</text>
  </g>

  <!-- ===================== lifelines ===================== -->
  <line x1="135"  y1="136" x2="135"  y2="670" class="lifeline"/>
  <line x1="420"  y1="136" x2="420"  y2="670" class="lifeline"/>
  <line x1="820"  y1="136" x2="820"  y2="670" class="lifestdio"/>
  <line x1="1040" y1="136" x2="1040" y2="670" class="lifestdio"/>

  <!-- ===================== setup phase (compact) ===================== -->
  <!-- 1. Browser → gateway: POST live_pvp + WS p1 (combined) -->
  <text x="277" y="163" text-anchor="middle" class="arrowtxt">POST live_pvp &#8594; receives p1_url + p2_url &#8594; WS p1</text>
  <line x1="135" y1="173" x2="420" y2="173" class="arrow" marker-end="url(#arrow)"/>

  <!-- 2. Claude → MCP: join_battle stdio -->
  <text x="930" y="203" text-anchor="middle" class="arrowstdiotxt">join_battle(battle_id, slot=p2, token)</text>
  <line x1="1040" y1="213" x2="820" y2="213" class="arrowstdio" marker-end="url(#arrow)"/>

  <!-- 3. MCP → gateway: WS p2 -->
  <text x="620" y="243" text-anchor="middle" class="arrowtxt">WS p2 (token)</text>
  <line x1="820" y1="253" x2="420" y2="253" class="arrow" marker-end="url(#arrow)"/>

  <!-- 4. gateway broadcasts state to BOTH (drawn as one arrow split — show two arrows fanning out, same Y) -->
  <text x="555" y="283" text-anchor="middle" class="arrowtxt">state frame (fog-of-war view for each side)</text>
  <line x1="420" y1="293" x2="135" y2="293" class="arrow" marker-end="url(#arrow)"/>
  <line x1="420" y1="293" x2="820" y2="293" class="arrow" marker-end="url(#arrow)"/>

  <!-- 5. MCP returns join_battle to Claude with initial view -->
  <text x="930" y="323" text-anchor="middle" class="arrowstdiotxt">returns { battle_id, slot, your_trainer, initial_view }</text>
  <line x1="820" y1="333" x2="1040" y2="333" class="arrowstdio" marker-end="url(#arrow)"/>

  <!-- ===================== loop bracket ===================== -->
  <rect x="50" y="358" width="1130" height="270" class="loop" rx="4"/>
  <text x="60" y="374" class="looptxt">LOOP: each turn (both sides submit, then gateway resolves once)</text>

  <!-- 6. Claude → MCP: wait(60) [blocks] -->
  <text x="930" y="396" text-anchor="middle" class="arrowstdiotxt">wait(60) &#8212; blocks until view is ready</text>
  <line x1="1040" y1="406" x2="820" y2="406" class="arrowstdio" marker-end="url(#arrow)"/>

  <!-- 7. Browser → gateway: action (the human acts, which the agent is waiting on) -->
  <text x="277" y="436" text-anchor="middle" class="arrowtxt">action (WS)</text>
  <line x1="135" y1="446" x2="420" y2="446" class="arrow" marker-end="url(#arrow)"/>

  <!-- The agent already 'pre-acted' from the previous turn's wait return; show as a parallel pre-existing action -->
  <!-- 8. MCP → gateway: action (already in flight from Claude's act() last turn) -->
  <text x="620" y="476" text-anchor="middle" class="arrowtxt">action (WS) &#8212; from Claude&#8217;s previous act()</text>
  <line x1="820" y1="486" x2="420" y2="486" class="arrow" marker-end="url(#arrow)"/>

  <!-- 9. gateway: engine.ResolveTurn (HOT inline) -->
  <path d="M 420 510 q 36 0 36 14 q 0 14 -36 14" class="arrowhot" marker-end="url(#arrowinline)"/>
  <text x="466" y="530" class="arrowhottxt">engine.ResolveTurn (pure, inline)</text>

  <!-- 10. gateway broadcasts turn frame to both -->
  <text x="555" y="562" text-anchor="middle" class="arrowtxt">turn frame (new view + log)</text>
  <line x1="420" y1="572" x2="135" y2="572" class="arrow" marker-end="url(#arrow)"/>
  <line x1="420" y1="572" x2="820" y2="572" class="arrow" marker-end="url(#arrow)"/>

  <!-- 11. MCP → Claude: wait() returns with the new view -->
  <text x="930" y="602" text-anchor="middle" class="arrowstdiotxt">wait returns { ready:true, view }</text>
  <line x1="820" y1="612" x2="1040" y2="612" class="arrowstdio" marker-end="url(#arrow)"/>

  <text x="600" y="660" text-anchor="middle" class="note">Claude calls act() right after wait() returns; the action then sits in the gateway until the human submits theirs. wait/act/wait is the agent loop &#8212; long-poll because MCP tools are unary and that&#8217;s how reactive agents drive themselves.</text>

  <!-- ===================== animation clock + packets ===================== -->
  <rect width="0" height="0">
    <animate id="cycle" attributeName="x" from="0" to="0" begin="0s; cycle.end+1s" dur="15s"/>
  </rect>

  <!-- setup packets -->
  <!-- 1: browser → gateway POST/WS -->
  <circle r="5" class="packet" cx="135" cy="173" opacity="0">
    <animate attributeName="cx" from="135" to="420" begin="cycle.begin+0.0s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+0.0s" dur="0.8s"/>
  </circle>
  <!-- 2: Claude → MCP join_battle (stdio packet) -->
  <circle r="5" class="packetstdio" cx="1040" cy="213" opacity="0">
    <animate attributeName="cx" from="1040" to="820" begin="cycle.begin+1.0s" dur="0.6s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+1.0s" dur="0.6s"/>
  </circle>
  <!-- 3: MCP → gateway WS p2 -->
  <circle r="5" class="packet" cx="820" cy="253" opacity="0">
    <animate attributeName="cx" from="820" to="420" begin="cycle.begin+1.8s" dur="1.0s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" begin="cycle.begin+1.8s" dur="1.0s"/>
  </circle>
  <!-- 4a + 4b: gateway broadcasts state to both (fan-out) — same begin -->
  <circle r="5" class="packet" cx="420" cy="293" opacity="0">
    <animate attributeName="cx" from="420" to="135" begin="cycle.begin+3.0s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+3.0s" dur="0.8s"/>
  </circle>
  <circle r="5" class="packet" cx="420" cy="293" opacity="0">
    <animate attributeName="cx" from="420" to="820" begin="cycle.begin+3.0s" dur="1.0s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" begin="cycle.begin+3.0s" dur="1.0s"/>
  </circle>
  <!-- 5: MCP returns join result to Claude -->
  <circle r="5" class="packetstdio" cx="820" cy="333" opacity="0">
    <animate attributeName="cx" from="820" to="1040" begin="cycle.begin+4.2s" dur="0.6s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+4.2s" dur="0.6s"/>
  </circle>

  <!-- ===== loop packets ===== -->
  <!-- 6: Claude → MCP wait() (stdio, blocking — slow drift, then fade) -->
  <circle r="5" class="packetstdio" cx="1040" cy="406" opacity="0">
    <animate attributeName="cx" from="1040" to="820" begin="cycle.begin+5.5s" dur="0.6s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+5.5s" dur="0.6s"/>
  </circle>
  <!-- 7: Browser → gateway action -->
  <circle r="5" class="packet" cx="135" cy="446" opacity="0">
    <animate attributeName="cx" from="135" to="420" begin="cycle.begin+6.4s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+6.4s" dur="0.8s"/>
  </circle>
  <!-- 8: MCP → gateway action (Claude's pre-existing) -->
  <circle r="5" class="packet" cx="820" cy="486" opacity="0">
    <animate attributeName="cx" from="820" to="420" begin="cycle.begin+7.5s" dur="1.0s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" begin="cycle.begin+7.5s" dur="1.0s"/>
  </circle>
  <!-- 9: gateway self-arrow ResolveTurn HOT -->
  <circle r="6" class="packethot" cx="420" cy="524" opacity="0">
    <animate attributeName="cx" values="420;456;420" keyTimes="0;0.5;1" begin="cycle.begin+8.8s" dur="0.9s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+8.8s" dur="0.9s"/>
    <animate attributeName="r" values="6;9;6" keyTimes="0;0.5;1" begin="cycle.begin+8.8s" dur="0.9s"/>
  </circle>
  <!-- 10a + 10b: gateway broadcasts turn frame to both -->
  <circle r="5" class="packet" cx="420" cy="572" opacity="0">
    <animate attributeName="cx" from="420" to="135" begin="cycle.begin+10.0s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+10.0s" dur="0.8s"/>
  </circle>
  <circle r="5" class="packet" cx="420" cy="572" opacity="0">
    <animate attributeName="cx" from="420" to="820" begin="cycle.begin+10.0s" dur="1.0s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" begin="cycle.begin+10.0s" dur="1.0s"/>
  </circle>
  <!-- 11: MCP returns from wait() to Claude -->
  <circle r="5" class="packetstdio" cx="820" cy="612" opacity="0">
    <animate attributeName="cx" from="820" to="1040" begin="cycle.begin+11.2s" dur="0.6s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+11.2s" dur="0.6s"/>
  </circle>
</svg>
