<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowinline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <style>
      .title    { fill:#e6edf3; font-weight:700; font-size:22px; }
      .subtitle { fill:#94a3b8; font-size:12px; }
      .lane     { fill:#1e3a5f; stroke:#3b82f6; stroke-width:2; }
      .lanehot  { fill:#3b2f0f; stroke:#f59e0b; stroke-width:2; }
      .lanetxt  { fill:#f1f5f9; font-weight:700; font-size:13px; }
      .lifeline { stroke:#3a4759; stroke-width:1.4; stroke-dasharray:4 4; }
      .arrow    { stroke:#475569; stroke-width:1.6; fill:none; }
      .arrowhot { stroke:#f59e0b; stroke-width:2;  fill:none; }
      .arrowtxt { fill:#cbd5e1; font-size:11px; font-weight:600; }
      .arrowhottxt { fill:#fbbf24; font-size:11.5px; font-weight:700; }
      .note     { fill:#94a3b8; font-size:10.5px; font-style:italic; }
      .loop     { stroke:#fbbf24; stroke-width:1.2; stroke-dasharray:4 3; fill:none; opacity:.55; }
      .looptxt  { fill:#fbbf24; font-size:10px; font-weight:700; letter-spacing:.5px; }
      .packet   { fill:#10b981; }
      .packethot{ fill:#f59e0b; }
    </style>
  </defs>

  <rect width="1200" height="660" fill="#0d1117"/>
  <text x="600" y="36" text-anchor="middle" class="title">Live vs AI &#8212; real-time, you vs the internal harness</text>
  <text x="600" y="56" text-anchor="middle" class="subtitle">player on a WebSocket &#183; AI offloaded to its own service &#183; turn resolved inline by the gateway</text>

  <!-- ===================== lane heads ===================== -->
  <g>
    <rect x="60"  y="80" width="160" height="36" rx="7" class="lane"/>
    <text x="140" y="103" text-anchor="middle" class="lanetxt">Player (browser)</text>
    <rect x="340" y="80" width="160" height="36" rx="7" class="lanehot"/>
    <text x="420" y="103" text-anchor="middle" class="lanetxt">gateway</text>
    <rect x="620" y="80" width="160" height="36" rx="7" class="lane"/>
    <text x="700" y="103" text-anchor="middle" class="lanetxt">RabbitMQ</text>
    <rect x="900" y="80" width="160" height="36" rx="7" class="lane"/>
    <text x="980" y="103" text-anchor="middle" class="lanetxt">ai-service</text>
  </g>

  <!-- ===================== lifelines ===================== -->
  <line x1="140" y1="118" x2="140" y2="630" class="lifeline"/>
  <line x1="420" y1="118" x2="420" y2="630" class="lifeline"/>
  <line x1="700" y1="118" x2="700" y2="630" class="lifeline"/>
  <line x1="980" y1="118" x2="980" y2="630" class="lifeline"/>

  <!-- ===================== setup phase ===================== -->
  <!-- 1. Player → gateway: POST live -->
  <text x="280" y="145" text-anchor="middle" class="arrowtxt">POST /api/battles (mode=live)</text>
  <line x1="140" y1="155" x2="420" y2="155" class="arrow" marker-end="url(#arrow)"/>

  <!-- 2. gateway → Player: ws url -->
  <text x="280" y="185" text-anchor="middle" class="arrowtxt">battleId + WS url</text>
  <line x1="420" y1="195" x2="140" y2="195" class="arrow" marker-end="url(#arrow)"/>

  <!-- 3. Player → gateway: WS connect -->
  <text x="280" y="225" text-anchor="middle" class="arrowtxt">WS connect /play</text>
  <line x1="140" y1="235" x2="420" y2="235" class="arrow" marker-end="url(#arrow)"/>

  <!-- 4. gateway → Player: initial state -->
  <text x="280" y="265" text-anchor="middle" class="arrowtxt">initial state (your turn)</text>
  <line x1="420" y1="275" x2="140" y2="275" class="arrow" marker-end="url(#arrow)"/>

  <!-- ===================== loop bracket ===================== -->
  <rect x="55" y="298" width="1090" height="290" class="loop" rx="4"/>
  <text x="65" y="314" class="looptxt">LOOP: each turn</text>

  <!-- 5. Player → gateway: submit action -->
  <text x="280" y="338" text-anchor="middle" class="arrowtxt">submit action (WS)</text>
  <line x1="140" y1="348" x2="420" y2="348" class="arrow" marker-end="url(#arrow)"/>

  <!-- 6. gateway → RabbitMQ: ai.job -->
  <text x="560" y="378" text-anchor="middle" class="arrowtxt">publish ai.job (with correlation id)</text>
  <line x1="420" y1="388" x2="700" y2="388" class="arrow" marker-end="url(#arrow)"/>

  <!-- 7. RabbitMQ → ai-service -->
  <text x="840" y="418" text-anchor="middle" class="arrowtxt">consume ai.job</text>
  <line x1="700" y1="428" x2="980" y2="428" class="arrow" marker-end="url(#arrow)"/>

  <!-- 8. ai-service self: harness.Decide -->
  <path d="M 980 448 q 36 0 36 14 q 0 14 -36 14" class="arrow" marker-end="url(#arrow)"/>
  <text x="1026" y="467" class="arrowtxt">harness.Decide (bounded budget)</text>

  <!-- 9. ai-service → RabbitMQ → gateway: ai.decided (drawn as one curved arrow that crosses the broker lane) -->
  <text x="700" y="500" text-anchor="middle" class="arrowtxt">publish ai.decided → consume (match by correlation id)</text>
  <path d="M 980 510 Q 700 528 420 510" class="arrow" marker-end="url(#arrow)" fill="none"/>

  <!-- 10. gateway self: engine.ResolveTurn (HIGHLIGHTED — the design insight) -->
  <path d="M 420 535 q 36 0 36 14 q 0 14 -36 14" class="arrowhot" marker-end="url(#arrowinline)"/>
  <text x="466" y="555" class="arrowhottxt">engine.ResolveTurn (pure, inline — no queue)</text>

  <!-- 11. gateway → Player: turn result -->
  <text x="280" y="586" text-anchor="middle" class="arrowtxt">turn result: HP, log, status (WS)</text>
  <line x1="420" y1="596" x2="140" y2="596" class="arrow" marker-end="url(#arrow)"/>

  <text x="600" y="640" text-anchor="middle" class="note">Battle state lives in Redis; the gateway holds none, so any instance can serve any battle. A turn timer bounds every decision &#8212; idle players get a default action; ai-service down falls back to a local heuristic.</text>

  <!-- ===================== animation clock + packets ===================== -->
  <rect width="0" height="0">
    <animate id="cycle" attributeName="x" from="0" to="0" begin="0s; cycle.end+0.8s" dur="13s"/>
  </rect>

  <!-- setup packets -->
  <circle r="5" class="packet" cx="140" cy="155" opacity="0">
    <animate attributeName="cx" from="140" to="420" begin="cycle.begin+0.0s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+0.0s" dur="0.8s"/>
  </circle>
  <circle r="5" class="packet" cx="420" cy="195" opacity="0">
    <animate attributeName="cx" from="420" to="140" begin="cycle.begin+1.0s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+1.0s" dur="0.8s"/>
  </circle>
  <circle r="5" class="packet" cx="140" cy="235" opacity="0">
    <animate attributeName="cx" from="140" to="420" begin="cycle.begin+2.0s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+2.0s" dur="0.8s"/>
  </circle>
  <circle r="5" class="packet" cx="420" cy="275" opacity="0">
    <animate attributeName="cx" from="420" to="140" begin="cycle.begin+3.0s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+3.0s" dur="0.8s"/>
  </circle>

  <!-- loop packets -->
  <!-- 5: action -->
  <circle r="5" class="packet" cx="140" cy="348" opacity="0">
    <animate attributeName="cx" from="140" to="420" begin="cycle.begin+4.4s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+4.4s" dur="0.8s"/>
  </circle>
  <!-- 6: ai.job -->
  <circle r="5" class="packet" cx="420" cy="388" opacity="0">
    <animate attributeName="cx" from="420" to="700" begin="cycle.begin+5.4s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+5.4s" dur="0.8s"/>
  </circle>
  <!-- 7: consume -->
  <circle r="5" class="packet" cx="700" cy="428" opacity="0">
    <animate attributeName="cx" from="700" to="980" begin="cycle.begin+6.4s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+6.4s" dur="0.8s"/>
  </circle>
  <!-- 8: harness self-arrow -->
  <circle r="5" class="packet" cx="980" cy="462" opacity="0">
    <animate attributeName="cx" values="980;1016;980" keyTimes="0;0.5;1" begin="cycle.begin+7.4s" dur="0.9s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+7.4s" dur="0.9s"/>
  </circle>
  <!-- 9: curved arrow across broker — animate along path via animateMotion -->
  <path id="returnpath" d="M 980 510 Q 700 528 420 510" fill="none" stroke="none"/>
  <circle r="5" class="packet" opacity="0">
    <animateMotion begin="cycle.begin+8.6s" dur="1.2s">
      <mpath xlink:href="#returnpath"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" begin="cycle.begin+8.6s" dur="1.2s"/>
  </circle>
  <!-- 10: gateway self-arrow ResolveTurn (HOT) -->
  <circle r="6" class="packethot" cx="420" cy="549" opacity="0">
    <animate attributeName="cx" values="420;456;420" keyTimes="0;0.5;1" begin="cycle.begin+10.1s" dur="0.9s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+10.1s" dur="0.9s"/>
    <animate attributeName="r" values="6;9;6" keyTimes="0;0.5;1" begin="cycle.begin+10.1s" dur="0.9s"/>
  </circle>
  <!-- 11: turn result back to player -->
  <circle r="5" class="packet" cx="420" cy="596" opacity="0">
    <animate attributeName="cx" from="420" to="140" begin="cycle.begin+11.2s" dur="0.9s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+11.2s" dur="0.9s"/>
  </circle>
</svg>
