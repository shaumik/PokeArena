<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="400" viewBox="0 0 860 400" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="PokeArena request flow: a job travels Browser to gateway to work exchange, fans out to battle-worker and ai-service, which publish events that fan out to leaderboard-worker and back to the gateway and browser.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4452"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="0.5" y="0.5" width="859" height="399" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- title -->
  <text x="28" y="34" font-size="17" font-weight="700" fill="#e6edf3">PokéArena — one battle, end to end</text>
  <text x="28" y="54" font-size="12" fill="#8b949e">A job is queued, fans out to a worker fleet, and the result fans back out as events.</text>

  <!-- ===================== wires ===================== -->
  <g fill="none" stroke="#3a4452" stroke-width="1.8" marker-end="url(#arrow)">
    <path id="e1"  d="M144,186 H222"/>
    <path id="e2"  d="M346,184 C 376,150 392,130 412,122"/>
    <path id="e4"  d="M546,116 C 586,104 610,98 644,96"/>
    <path id="e5"  d="M546,126 C 588,150 610,174 644,186"/>
    <path id="e6"  d="M648,102 C 596,150 562,216 548,250"/>
    <path id="e7"  d="M648,196 C 602,218 566,242 548,258"/>
    <path id="e8"  d="M546,268 C 586,284 602,296 632,300"/>
    <path id="e9"  d="M412,256 C 382,244 364,218 346,200"/>
    <path id="e10" d="M222,196 H144"/>
  </g>
  <!-- persist wire (bidirectional, no arrow) -->
  <path id="e11" d="M286,216 V308" fill="none" stroke="#2d3b30" stroke-width="1.8" stroke-dasharray="4 4"/>

  <!-- ===================== nodes ===================== -->
  <!-- Browser -->
  <g>
    <rect x="24" y="164" width="120" height="52" rx="9" fill="#161b22" stroke="#8b949e"/>
    <text x="84" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Browser SPA</text>
    <text x="84" y="204" text-anchor="middle" font-size="10" fill="#8b949e">player + spectator</text>
  </g>
  <!-- Gateway -->
  <g>
    <rect x="226" y="164" width="120" height="52" rx="9" fill="#161b22" stroke="#58a6ff"/>
    <text x="286" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">gateway</text>
    <text x="286" y="204" text-anchor="middle" font-size="10" fill="#8b949e">REST · WS · SSE</text>
  </g>
  <!-- Work exchange -->
  <g>
    <rect x="414" y="96" width="132" height="48" rx="9" fill="#1c2128" stroke="#f0b429"/>
    <text x="480" y="118" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">work exchange</text>
    <text x="480" y="133" text-anchor="middle" font-size="10" fill="#8b949e">RabbitMQ · direct</text>
  </g>
  <!-- Events exchange -->
  <g>
    <rect x="414" y="236" width="132" height="48" rx="9" fill="#1c2128" stroke="#f0b429"/>
    <text x="480" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">events exchange</text>
    <text x="480" y="273" text-anchor="middle" font-size="10" fill="#8b949e">RabbitMQ · topic</text>
  </g>
  <!-- battle-worker -->
  <g>
    <rect x="648" y="72" width="158" height="46" rx="9" fill="#161b22" stroke="#a371f7"/>
    <text x="727" y="93" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">battle-worker</text>
    <text x="727" y="108" text-anchor="middle" font-size="10" fill="#8b949e">resolves whole battle</text>
  </g>
  <!-- ai-service -->
  <g>
    <rect x="648" y="167" width="158" height="46" rx="9" fill="#161b22" stroke="#a371f7"/>
    <text x="727" y="188" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">ai-service</text>
    <text x="727" y="203" text-anchor="middle" font-size="10" fill="#8b949e">expectimax, time-boxed</text>
  </g>
  <!-- leaderboard-worker -->
  <g>
    <rect x="632" y="277" width="174" height="46" rx="9" fill="#161b22" stroke="#a371f7"/>
    <text x="719" y="298" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">leaderboard-worker</text>
    <text x="719" y="313" text-anchor="middle" font-size="10" fill="#8b949e">recomputes Elo</text>
  </g>
  <!-- State -->
  <g>
    <rect x="196" y="308" width="180" height="46" rx="9" fill="#161b22" stroke="#3fb950"/>
    <text x="286" y="329" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">PostgreSQL · Redis</text>
    <text x="286" y="344" text-anchor="middle" font-size="10" fill="#8b949e">system of record + live state</text>
  </g>

  <!-- ===================== packets ===================== -->
  <!-- JOB (blue): browser -> gateway -> work exchange -> {battle-worker, ai-service} -->
  <g opacity="0">
    <circle r="9" fill="#58a6ff" opacity="0.22"/><circle r="4.5" fill="#58a6ff"/>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.16;1"><mpath xlink:href="#e1"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.155;0.17;1"/>
  </g>
  <g opacity="0">
    <circle r="9" fill="#58a6ff" opacity="0.22"/><circle r="4.5" fill="#58a6ff"/>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.16;0.32;1"><mpath xlink:href="#e2"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.15;0.165;0.315;0.33;1"/>
  </g>
  <g opacity="0">
    <circle r="9" fill="#58a6ff" opacity="0.22"/><circle r="4.5" fill="#58a6ff"/>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.32;0.48;1"><mpath xlink:href="#e4"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.31;0.325;0.475;0.49;1"/>
  </g>
  <g opacity="0">
    <circle r="9" fill="#58a6ff" opacity="0.22"/><circle r="4.5" fill="#58a6ff"/>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.32;0.48;1"><mpath xlink:href="#e5"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.31;0.325;0.475;0.49;1"/>
  </g>

  <!-- PERSIST (green): gateway -> state -->
  <g opacity="0">
    <circle r="8" fill="#3fb950" opacity="0.22"/><circle r="4" fill="#3fb950"/>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.22;0.40;1"><mpath xlink:href="#e11"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.21;0.225;0.395;0.41;1"/>
  </g>

  <!-- EVENT (amber): workers -> events exchange -> {leaderboard, gateway} -> browser -->
  <g opacity="0">
    <circle r="9" fill="#f0b429" opacity="0.22"/><circle r="4.5" fill="#f0b429"/>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.48;0.64;1"><mpath xlink:href="#e6"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.47;0.485;0.635;0.65;1"/>
  </g>
  <g opacity="0">
    <circle r="9" fill="#f0b429" opacity="0.22"/><circle r="4.5" fill="#f0b429"/>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.48;0.64;1"><mpath xlink:href="#e7"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.47;0.485;0.635;0.65;1"/>
  </g>
  <g opacity="0">
    <circle r="9" fill="#f0b429" opacity="0.22"/><circle r="4.5" fill="#f0b429"/>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.64;0.82;1"><mpath xlink:href="#e8"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.63;0.645;0.815;0.83;1"/>
  </g>
  <g opacity="0">
    <circle r="9" fill="#f0b429" opacity="0.22"/><circle r="4.5" fill="#f0b429"/>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.64;0.82;1"><mpath xlink:href="#e9"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.63;0.645;0.815;0.83;1"/>
  </g>
  <g opacity="0">
    <circle r="9" fill="#f0b429" opacity="0.22"/><circle r="4.5" fill="#f0b429"/>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.82;0.98;1"><mpath xlink:href="#e10"/></animateMotion>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.81;0.825;0.975;0.99;1"/>
  </g>

  <!-- ===================== legend ===================== -->
  <g font-size="11" fill="#8b949e">
    <circle cx="556" cy="372" r="5" fill="#58a6ff"/><text x="566" y="376">job (POST /battles → 202)</text>
    <circle cx="696" cy="372" r="5" fill="#f0b429"/><text x="706" y="376">event (fan-out)</text>
    <circle cx="792" cy="372" r="5" fill="#3fb950"/><text x="802" y="376">state</text>
  </g>
</svg>
