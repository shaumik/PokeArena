<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .title    { fill:#e6edf3; font-weight:700; font-size:22px; }
      .subtitle { fill:#94a3b8; font-size:12px; }
      .lane     { fill:#1e3a5f; stroke:#3b82f6; stroke-width:2; }
      .lanetxt  { fill:#f1f5f9; font-weight:700; font-size:13px; }
      .lifeline { stroke:#3a4759; stroke-width:1.4; stroke-dasharray:4 4; }
      .arrow    { stroke:#475569; stroke-width:1.6; fill:none; }
      .arrowtxt { fill:#cbd5e1; font-size:11px; font-weight:600; }
      .note     { fill:#94a3b8; font-size:10.5px; font-style:italic; }
      .loop     { stroke:#fbbf24; stroke-width:1.2; stroke-dasharray:4 3; fill:none; opacity:.55; }
      .looptxt  { fill:#fbbf24; font-size:10px; font-weight:700; letter-spacing:.5px; }
      .packet   { fill:#10b981; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#0d1117"/>
  <text x="600" y="36" text-anchor="middle" class="title">Quick Sim &#8212; async, AI vs AI</text>
  <text x="600" y="56" text-anchor="middle" class="subtitle">job in &#183; competing-consumer workers &#183; events fan out &#183; leaderboard updated</text>

  <!-- ===================== lane heads ===================== -->
  <g>
    <rect x="40"  y="80" width="140" height="36" rx="7" class="lane"/>
    <text x="110" y="103" text-anchor="middle" class="lanetxt">Client</text>
    <rect x="260" y="80" width="140" height="36" rx="7" class="lane"/>
    <text x="330" y="103" text-anchor="middle" class="lanetxt">gateway</text>
    <rect x="480" y="80" width="140" height="36" rx="7" class="lane"/>
    <text x="550" y="103" text-anchor="middle" class="lanetxt">RabbitMQ</text>
    <rect x="700" y="80" width="160" height="36" rx="7" class="lane"/>
    <text x="780" y="103" text-anchor="middle" class="lanetxt">battle-worker</text>
    <rect x="950" y="80" width="200" height="36" rx="7" class="lane"/>
    <text x="1050" y="103" text-anchor="middle" class="lanetxt">leaderboard-worker</text>
  </g>

  <!-- ===================== lifelines ===================== -->
  <line x1="110"  y1="118" x2="110"  y2="590" class="lifeline"/>
  <line x1="330"  y1="118" x2="330"  y2="590" class="lifeline"/>
  <line x1="550"  y1="118" x2="550"  y2="590" class="lifeline"/>
  <line x1="780"  y1="118" x2="780"  y2="590" class="lifeline"/>
  <line x1="1050" y1="118" x2="1050" y2="590" class="lifeline"/>

  <!-- ===================== static arrows + labels ===================== -->
  <!-- 1. Client → gateway -->
  <text x="220" y="145" text-anchor="middle" class="arrowtxt">POST /api/battles (mode=quicksim)</text>
  <line x1="110" y1="155" x2="330" y2="155" class="arrow" marker-end="url(#arrow)"/>

  <!-- 2. gateway → RabbitMQ -->
  <text x="440" y="185" text-anchor="middle" class="arrowtxt">publish quicksim.job</text>
  <line x1="330" y1="195" x2="550" y2="195" class="arrow" marker-end="url(#arrow)"/>

  <!-- 3. gateway → Client (response) -->
  <text x="220" y="225" text-anchor="middle" class="arrowtxt">202 Accepted (battleId)</text>
  <line x1="330" y1="235" x2="110" y2="235" class="arrow" marker-end="url(#arrow)"/>

  <!-- 4. RabbitMQ → battle-worker -->
  <text x="665" y="265" text-anchor="middle" class="arrowtxt">consume (manual-ack)</text>
  <line x1="550" y1="275" x2="780" y2="275" class="arrow" marker-end="url(#arrow)"/>

  <!-- Loop bracket -->
  <rect x="700" y="295" width="200" height="118" class="loop" rx="4"/>
  <text x="710" y="311" class="looptxt">LOOP: each turn</text>

  <!-- 5. worker self: ResolveTurn -->
  <path d="M 780 335 q 36 0 36 14 q 0 14 -36 14" class="arrow" marker-end="url(#arrow)" fill="none"/>
  <text x="826" y="354" class="arrowtxt">engine.ResolveTurn (pure)</text>

  <!-- 6. worker self: persist + publish turn.resolved -->
  <path d="M 780 385 q 36 0 36 14 q 0 14 -36 14" class="arrow" marker-end="url(#arrow)" fill="none"/>
  <text x="826" y="404" class="arrowtxt">save turn + publish turn.resolved.{id}</text>

  <!-- 7. battle-worker → RabbitMQ: battle.completed -->
  <text x="665" y="445" text-anchor="middle" class="arrowtxt">publish battle.completed.{id}</text>
  <line x1="780" y1="455" x2="550" y2="455" class="arrow" marker-end="url(#arrow)"/>

  <!-- 8. RabbitMQ → leaderboard-worker -->
  <text x="800" y="485" text-anchor="middle" class="arrowtxt">battle.completed.* (durable consumer)</text>
  <line x1="550" y1="495" x2="1050" y2="495" class="arrow" marker-end="url(#arrow)"/>

  <!-- 9. leaderboard self: update Elo (no Postgres lane drawn; labelled instead) -->
  <path d="M 1050 515 q 36 0 36 14 q 0 14 -36 14" class="arrow" marker-end="url(#arrow)" fill="none"/>
  <text x="1096" y="534" class="arrowtxt">update Elo + W/L (Postgres)</text>

  <text x="600" y="582" text-anchor="middle" class="note">Postgres is the system of record; turn-by-turn writes and the Elo update both land there. Drawn as self-arrows to keep the lane count manageable.</text>

  <!-- ===================== animation clock + packets ===================== -->
  <!-- The clock is an invisible element whose 'begin' chain (begin=0s; cycle.end+0.8s)
       drives every packet via begin="cycle.begin + offset". One source of truth for
       loop timing; tweak dur on the clock to change pace globally. -->
  <rect width="0" height="0">
    <animate id="cycle" attributeName="x" from="0" to="0" begin="0s; cycle.end+0.8s" dur="11s"/>
  </rect>

  <!-- Per-packet definitions. Each packet starts invisible at its source lane, then -->
  <!--   begin="cycle.begin+OFFSET" → travel cx from source-lane-x to target-lane-x -->
  <!--   over 0.8s with opacity 0→1→0. Returns to start state when the cycle restarts. -->

  <!-- packet 1: Client → gateway @ 0.0s -->
  <circle r="5" class="packet" cx="110" cy="155" opacity="0">
    <animate attributeName="cx" from="110" to="330" begin="cycle.begin+0.0s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+0.0s" dur="0.8s"/>
  </circle>

  <!-- packet 2: gateway → RabbitMQ @ 1.0s -->
  <circle r="5" class="packet" cx="330" cy="195" opacity="0">
    <animate attributeName="cx" from="330" to="550" begin="cycle.begin+1.0s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+1.0s" dur="0.8s"/>
  </circle>

  <!-- packet 3: gateway → Client @ 1.2s (concurrent-ish with #2; the 202 returns fast) -->
  <circle r="5" class="packet" cx="330" cy="235" opacity="0">
    <animate attributeName="cx" from="330" to="110" begin="cycle.begin+1.2s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+1.2s" dur="0.8s"/>
  </circle>

  <!-- packet 4: RabbitMQ → battle-worker @ 2.4s -->
  <circle r="5" class="packet" cx="550" cy="275" opacity="0">
    <animate attributeName="cx" from="550" to="780" begin="cycle.begin+2.4s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+2.4s" dur="0.8s"/>
  </circle>

  <!-- packets 5+6 live in the loop bracket — show two turn iterations to convey "loop" -->
  <!-- packet 5a: worker self-arrow ResolveTurn @ 3.6s -->
  <circle r="5" class="packet" cx="780" cy="349" opacity="0">
    <animate attributeName="cx" values="780;816;780" keyTimes="0;0.5;1" begin="cycle.begin+3.6s" dur="0.7s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+3.6s" dur="0.7s"/>
  </circle>
  <!-- packet 6a: worker self-arrow persist+publish @ 4.4s -->
  <circle r="5" class="packet" cx="780" cy="399" opacity="0">
    <animate attributeName="cx" values="780;816;780" keyTimes="0;0.5;1" begin="cycle.begin+4.4s" dur="0.7s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+4.4s" dur="0.7s"/>
  </circle>
  <!-- packet 5b: 2nd turn iteration @ 5.4s -->
  <circle r="5" class="packet" cx="780" cy="349" opacity="0">
    <animate attributeName="cx" values="780;816;780" keyTimes="0;0.5;1" begin="cycle.begin+5.4s" dur="0.7s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+5.4s" dur="0.7s"/>
  </circle>
  <circle r="5" class="packet" cx="780" cy="399" opacity="0">
    <animate attributeName="cx" values="780;816;780" keyTimes="0;0.5;1" begin="cycle.begin+6.2s" dur="0.7s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+6.2s" dur="0.7s"/>
  </circle>

  <!-- packet 7: battle-worker → RabbitMQ (battle.completed) @ 7.5s -->
  <circle r="5" class="packet" cx="780" cy="455" opacity="0">
    <animate attributeName="cx" from="780" to="550" begin="cycle.begin+7.5s" dur="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+7.5s" dur="0.8s"/>
  </circle>

  <!-- packet 8: RabbitMQ → leaderboard @ 8.7s — longer travel, longer dur -->
  <circle r="5" class="packet" cx="550" cy="495" opacity="0">
    <animate attributeName="cx" from="550" to="1050" begin="cycle.begin+8.7s" dur="1.2s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.07;0.93;1" begin="cycle.begin+8.7s" dur="1.2s"/>
  </circle>

  <!-- packet 9: leaderboard self-arrow update Elo @ 10.2s -->
  <circle r="5" class="packet" cx="1050" cy="529" opacity="0">
    <animate attributeName="cx" values="1050;1086;1050" keyTimes="0;0.5;1" begin="cycle.begin+10.2s" dur="0.7s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="cycle.begin+10.2s" dur="0.7s"/>
  </circle>
</svg>
